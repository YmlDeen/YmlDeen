<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIVE GOLD TERMINAL & BKK Clock</title>
  <style>
    body {
      background: #0f172a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 30px;
    }
    #clock {
      font-size: 48px;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .subtitle {
      font-size: 18px;
      color: #9ca3af;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <div class="subtitle">Bangkok · Thailand · GMT +7</div>
  <div id="clock">--:--:--</div>

  <!-- คุณสามารถใส่ส่วนอื่นตามต้องการ เช่น ราคาทอง, XAUUSD -->

  <script>
    function updateClock() {
      const now = new Date();
      const options = {
        timeZone: "Asia/Bangkok",
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      };
      const timeString = new Intl.DateTimeFormat("en-US", options).format(now);
      document.getElementById("clock").textContent = timeString;
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>

</body>
</html>
