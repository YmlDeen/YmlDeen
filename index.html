<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gold Control Center</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:'Inter',sans-serif;
    background:linear-gradient(135deg,#1e3c72,#2a5298);
    min-height:100vh;
    color:white;
    overflow-x:hidden;
}

/* Ambient Light */
body::before{
    content:"";
    position:fixed;
    width:700px;
    height:700px;
    background:radial-gradient(circle,#6a8dff55,transparent);
    top:-200px;
    left:-200px;
    animation:moveLight 12s infinite alternate ease-in-out;
    z-index:0;
}
@keyframes moveLight{
    from{transform:translate(0,0)}
    to{transform:translate(200px,150px)}
}

.container{
    position:relative;
    z-index:1;
    max-width:1100px;
    margin:auto;
    padding:40px 20px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:25px;
}

.header{grid-column:1/-1;text-align:center;}
.header h1{font-size:32px;font-weight:800;}
.clock{margin-top:10px;font-size:14px;opacity:.7;}

.card{
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(25px);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:25px;
    padding:30px;
    box-shadow:0 20px 40px rgba(0,0,0,.4);
    transition:.3s ease;
}
.card:hover{transform:translateY(-10px);}

.big{font-size:42px;font-weight:800;}
.sub{margin-top:10px;font-size:14px;opacity:.6;}

.up{color:#00ffcc;text-shadow:0 0 15px #00ffcc;}
.down{color:#ff4d88;text-shadow:0 0 15px #ff4d88;}

.chart{grid-column:1/-1;}
iframe{width:100%;height:420px;border:none;border-radius:18px;}

.backtest-wrap{
    grid-column:1/-1;
    display:flex;
    justify-content:center;
    margin-top:30px;
}

.backtest-btn{
    padding:16px 36px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    border-radius:18px;
    background:linear-gradient(135deg,#00ffcc,#00b3ff);
    color:white;
    text-decoration:none;
    box-shadow:0 0 20px #00ffcc88,0 0 40px #00b3ff55;
    transition:.4s ease;
}
.backtest-btn:hover{
    transform:translateY(-8px) scale(1.05);
    box-shadow:0 0 40px #00ffcc,0 0 80px #00b3ff;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>Gold Control Center</h1>
<div class="clock" id="clock"></div>
</div>

<div class="card">
<div class="big" id="thaiPrice">฿--</div>
<div class="sub">Thai Gold 96.5%</div>
</div>

<div class="card">
<div class="big" id="spotPrice">$--</div>
<div class="sub" id="spotChange">--</div>
</div>

<div class="card">
<div class="big" id="usdRate">--</div>
<div class="sub">USD / THB</div>
</div>

<div class="card chart">
<div class="sub" style="margin-bottom:15px">Live Market Chart</div>
<iframe src="https://s.tradingview.com/widgetembed/?symbol=OANDA%3AXAUUSD&interval=60&theme=dark&style=1&locale=en&allow_symbol_change=0"></iframe>
</div>

<div class="backtest-wrap">
<a href="/backtest" class="backtest-btn">
🚀 Launch Backtest Terminal
</a>
</div>

</div>

<script>

/* Clock */
function updateClock(){
    const now = new Date();
    document.getElementById("clock").textContent =
        "Bangkok Time · " + now.toLocaleTimeString('en-GB',{timeZone:'Asia/Bangkok'});
}
setInterval(updateClock,1000);
updateClock();

/* Load Gold */
async function loadGold(){
    try{
        const res = await fetch('/api/gold');
        const d = await res.json();

        document.getElementById('thaiPrice').textContent =
            "฿" + (d.thai || 0).toLocaleString();

        const spot = document.getElementById('spotPrice');
        const change = document.getElementById('spotChange');

        const price = (typeof d.price === "number")
            ? d.price.toFixed(2)
            : "0.00";

        spot.textContent = "$" + price;

        const ch = (typeof d.ch === "number") ? d.ch : 0;
        const chp = (typeof d.chp === "number") ? d.chp : 0;

        change.textContent =
            (ch >= 0 ? "+" : "") + ch.toFixed(2) +
            " (" + (ch >= 0 ? "+" : "") + chp.toFixed(2) + "%)";

        spot.classList.remove("up","down");
        change.classList.remove("up","down");

        if(ch >= 0){
            spot.classList.add("up");
            change.classList.add("up");
        }else{
            spot.classList.add("down");
            change.classList.add("down");
        }

        document.getElementById('usdRate').textContent =
            (d.usdthb || 0).toFixed(2);

    }catch(e){
        console.log("API ERROR:", e);
    }
}

loadGold();
setInterval(loadGold,15000);

</script>

</body>
</html>
