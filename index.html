<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gold Explorer Terminal</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>

body{
    margin:0;
    font-family:'Fredoka',sans-serif;
    background: radial-gradient(circle at top,#2b2e63,#14162e);
    color:white;
    display:flex;
    justify-content:center;
}

.container{
    width:100%;
    max-width:420px;
    padding:20px;
}

.hero{
    background:linear-gradient(145deg,#ffd76b,#ffb700);
    border-radius:30px;
    padding:30px;
    text-align:center;
    box-shadow:0 20px 40px rgba(0,0,0,.5);
    transform:perspective(1000px) rotateX(8deg);
}

.hero h1{
    font-size:40px;
    margin:0;
    color:#222;
}

.hero p{
    margin:10px 0 0;
    font-weight:600;
    color:#333;
}

.card{
    margin-top:25px;
    background:linear-gradient(145deg,#3a3d6a,#26284b);
    padding:25px;
    border-radius:25px;
    box-shadow:0 15px 30px rgba(0,0,0,.6);
    transform:perspective(1000px) rotateX(6deg);
}

.label{
    font-size:14px;
    opacity:.7;
    margin-bottom:10px;
}

.price{
    font-size:34px;
    font-weight:600;
    color:#ffd76b;
}

.mascot{
    text-align:center;
    font-size:50px;
    margin-top:20px;
}

.footer{
    margin-top:30px;
    text-align:center;
    opacity:.5;
    font-size:12px;
}

</style>
</head>
<body>

<div class="container">

<div class="hero">
    <h1 id="thaiPrice">฿--</h1>
    <p>Thai Gold 96.5%</p>
</div>

<div class="card">
    <div class="label">Gold Spot</div>
    <div class="price" id="spotPrice">$--</div>
</div>

<div class="card">
    <div class="label">USD / THB</div>
    <div class="price" id="usdRate">--</div>
</div>

<div class="mascot">
🪐✨
</div>

<div class="footer">
Gold Explorer · 3D Cartoon UI
</div>

</div>

<script>
async function loadGold(){
    try{
        const res = await fetch('/api/gold');
        const d = await res.json();

        document.getElementById('thaiPrice').textContent =
            "฿" + (d.thai || 0).toLocaleString();

        document.getElementById('spotPrice').textContent =
            "$" + (d.price || 0).toFixed(2);

        document.getElementById('usdRate').textContent =
            (d.usdthb || 0).toFixed(2);

    }catch(e){
        console.error(e);
    }
}

loadGold();
setInterval(loadGold,60000);
</script>

</body>
</html>
