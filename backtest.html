<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H1 Replay Simulator</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{
font-family:'Inter',sans-serif;
background:#0f2027;
color:white;
padding:20px}
.top{
display:flex;
justify-content:space-between;
margin-bottom:10px}
button{
padding:8px 12px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:600}
.next{background:#00ffcc}
.buy{background:#00cc88}
.sell{background:#ff4d88}
.close{background:#ffaa00}
.home{background:#555}
.panel{margin-top:10px}
</style>
</head>
<body>

<div class="top">
<h2>H1 Replay Simulator</h2>
<button class="home" onclick="goHome()">← Home</button>
</div>

<canvas id="chart" height="120"></canvas>

<div class="panel">
Risk % <input id="risk" value="1" style="width:60px">
SL <input id="sl" style="width:80px">
TP <input id="tp" style="width:80px">
<button class="next" onclick="nextCandle()">Next</button>
<button class="buy" onclick="openTrade('long')">Buy</button>
<button class="sell" onclick="openTrade('short')">Sell</button>
<button class="close" onclick="closeTrade()">Close</button>
</div>

<div id="status"></div>
<div id="equity"></div>

<script>

let data=[];
let visibleData=[];
let index=50;
let chart;
let balance=1000;
let trade=null;

async function loadData(){
try{
let res=await fetch('/api/gold-history-h1');
data=await res.json();
}catch{
let price=1800;
for(let i=0;i<300;i++){
let open=price;
price+=(Math.random()-0.5)*10;
let close=price;
data.push({
time:i,
open:open,
high:Math.max(open,close)+5,
low:Math.min(open,close)-5,
close:close
});
}
}
visibleData=data.slice(0,index);
initChart();
}

function initChart(){
let ctx=document.getElementById('chart').getContext('2d');
chart=new Chart(ctx,{
type:'candlestick',
data:{
datasets:[{
label:'H1',
data:visibleData
}]
}
});
}

function nextCandle(){
if(index>=data.length) return;
visibleData.push(data[index]);
index++;
chart.update();
checkSLTP();
}

function openTrade(type){
if(trade) return;
let entry=visibleData[visibleData.length-1].close;
let sl=parseFloat(document.getElementById("sl").value);
let tp=parseFloat(document.getElementById("tp").value);
let risk=parseFloat(document.getElementById("risk").value)/100;

trade={type,entry,sl,tp,risk};
updateStatus();
}

function checkSLTP(){
if(!trade) return;
let price=visibleData[visibleData.length-1].close;

if(trade.type==="long"){
if(price<=trade.sl || price>=trade.tp)
closeTrade();
}else{
if(price>=trade.sl || price<=trade.tp)
closeTrade();
}
updateStatus();
}

function closeTrade(){
if(!trade) return;
let price=visibleData[visibleData.length-1].close;
let riskAmt=balance*trade.risk;
let diff= trade.type==="long"
? price-trade.entry
: trade.entry-price;

let pnl=(diff/(trade.entry-trade.sl))*riskAmt;
balance+=pnl;
trade=null;
updateStatus();
}

function updateStatus(){
document.getElementById("status").innerHTML=
trade
? `Open ${trade.type} | Entry: ${trade.entry}`
: "No Position";

document.getElementById("equity").innerHTML=
`Balance: ${balance.toFixed(2)}`;
}

function goHome(){
window.location.href="https://ymldeen.onrender.com/";
}

loadData();

</script>
</body>
</html>
