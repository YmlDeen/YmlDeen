<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backtest Terminal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{
    font-family:'Inter',sans-serif;
    background:linear-gradient(135deg,#1e3c72,#2a5298);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
}

.container{
    width:100%;
    max-width:480px;
    padding:30px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(25px);
    border-radius:25px;
    box-shadow:0 20px 40px rgba(0,0,0,.4);
}

.title{text-align:center;font-weight:800;margin-bottom:20px;}
.price{text-align:center;font-size:36px;margin-bottom:20px;}
.status{text-align:center;margin-bottom:15px;opacity:.8;}

.button-group{
    display:flex;
    justify-content:space-between;
    margin-bottom:20px;
}

button{
    width:32%;
    padding:14px;
    border:none;
    border-radius:14px;
    font-weight:700;
    cursor:pointer;
}

.buy{background:#00ffcc;color:#111;}
.sell{background:#ff4d88;color:#fff;}
.close{background:#ffffff33;color:#fff;}

.stats{
    background:rgba(255,255,255,0.15);
    padding:15px;
    border-radius:15px;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">
<div class="title">Backtest Terminal</div>
<div class="price">$--</div>
<div class="status">Demo Mode</div>

<div class="button-group">
<button class="buy">BUY</button>
<button class="sell">SELL</button>
<button class="close">CLOSE</button>
</div>

<div class="stats">
Ready for strategy testing.
</div>

</div>

</body>
</html>
